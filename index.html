<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Marathon Survivor</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #080a12; /* Deep dark blue */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #00ffff; /* Neon Cyan */
            text-shadow: 0 0 10px #00ffff;
        }
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            background: rgba(8, 10, 18, 0.7);
            padding: 10px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }
        .hud span {
            display: block;
            margin-bottom: 5px;
        }
        .menu {
            background: rgba(8, 10, 18, 0.95);
            border: 3px solid #ff00ff; /* Neon Magenta */
            box-shadow: 0 0 20px #ff00ff;
            padding: 30px;
            border-radius: 0px; /* Blocky */
            pointer-events: auto;
            max-width: 90%;
        }
        h1 { margin-top: 0; font-size: 28px; color: #ffff00; text-shadow: 0 0 10px #ffff00; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.6; color: #fff; text-shadow: none; }
        button {
            background: #080a12;
            color: #00ffff;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px #00ffff inset, 0 0 10px #00ffff;
            padding: 15px 20px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }
        button:active {
            background: #00ffff;
            color: #000;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud" class="hud hidden">
        <span id="wave-display" style="color: #ffff00; text-shadow: 0 0 5px #ffff00;">WAVE: 1/10</span>
        <span id="shield-display" style="color: #00ffff; text-shadow: 0 0 5px #00ffff;">SHIELD: 50</span>
        <span id="hp-display" style="color: #ff00ff; text-shadow: 0 0 5px #ff00ff;">HP: 100</span>
        <span id="enemy-display" style="color: #fff; text-shadow: 0 0 5px #fff;">ENEMIES: 0</span>
    </div>

    <div id="ui-layer">
        <div id="start-menu" class="menu">
            <h1>RUNNER PROTOCOL</h1>
            <p>DEFEND YOUR POSITION. AIM WITH THE JOYSTICK.</p>
            <p>SURVIVE 10 WAVES.</p>
            <button onclick="startGame()">INITIALIZE</button>
        </div>

        <div id="upgrade-menu" class="menu hidden">
            <h1>SECTOR CLEARED</h1>
            <p>CHOOSE CYBERNETIC ENHANCEMENT:</p>
            <button onclick="applyUpgrade('damage')">DAMAGE UP</button><br>
            <button onclick="applyUpgrade('firerate')">FIRE RATE UP</button><br>
            <button onclick="applyUpgrade('shield')">SHIELD CAPACITY UP</button>
        </div>

        <div id="game-over-menu" class="menu hidden" style="border-color: #ff0000; box-shadow: 0 0 20px #ff0000;">
            <h1 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">SYSTEM FAILURE</h1>
            <p>YOU HAVE BEEN DISCONNECTED.</p>
            <button onclick="resetGame()" style="border-color: #ff0000; color: #ff0000; box-shadow: 0 0 10px #ff0000 inset, 0 0 10px #ff0000;">REBOOT</button>
        </div>

        <div id="victory-menu" class="menu hidden" style="border-color: #00ff00; box-shadow: 0 0 20px #00ff00;">
            <h1 style="color: #00ff00; text-shadow: 0 0 10px #00ff00;">EXTRACTION COMPLETE</h1>
            <p>YOU SURVIVED THE ASSAULT.</p>
            <button onclick="resetGame()" style="border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px #00ff00 inset, 0 0 10px #00ff00;">RETURN TO LOBBY</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startMenu = document.getElementById('start-menu');
    const upgradeMenu = document.getElementById('upgrade-menu');
    const gameOverMenu = document.getElementById('game-over-menu');
    const victoryMenu = document.getElementById('victory-menu');
    const hud = document.getElementById('hud');
    const waveDisplay = document.getElementById('wave-display');
    const shieldDisplay = document.getElementById('shield-display');
    const hpDisplay = document.getElementById('hp-display');
    const enemyDisplay = document.getElementById('enemy-display');

    let width, height;
    let gameState = 'START'; 
    let wave = 1;
    let maxWaves = 10;
    let lastTime = 0;
    
    let player;
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let particles = [];
    let obstacles = [];
    
    let enemiesToSpawn = 0;
    let spawnTimer = 0;
    let spawnInterval = 1000;

    let joystick = {
        active: false,
        touchId: null,
        baseX: 0, baseY: 0,
        nubX: 0, nubY: 0,
        radius: 60,
        angle: 0
    };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        joystick.baseX = width / 2;
        joystick.baseY = height - 120;
        joystick.nubX = joystick.baseX;
        joystick.nubY = joystick.baseY;

        if (player) {
            player.x = width / 2;
            player.y = height / 2 - 50; 
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
    canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
    canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
    canvas.addEventListener('touchcancel', handleTouchEnd, {passive: false});

    function handleTouchStart(e) {
        e.preventDefault();
        if (gameState !== 'PLAY') return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            let dist = Math.hypot(t.clientX - joystick.baseX, t.clientY - joystick.baseY);
            if (dist < joystick.radius * 2.5 && joystick.touchId === null) {
                joystick.active = true;
                joystick.touchId = t.identifier;
                updateJoystick(t.clientX, t.clientY);
            }
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (gameState !== 'PLAY' || !joystick.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            if (t.identifier === joystick.touchId) {
                updateJoystick(t.clientX, t.clientY);
            }
        }
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            if (t.identifier === joystick.touchId) {
                joystick.active = false;
                joystick.touchId = null;
                joystick.nubX = joystick.baseX;
                joystick.nubY = joystick.baseY;
            }
        }
    }

    function updateJoystick(x, y) {
        let dx = x - joystick.baseX;
        let dy = y - joystick.baseY;
        let dist = Math.hypot(dx, dy);
        joystick.angle = Math.atan2(dy, dx);
        
        let cappedDist = Math.min(dist, joystick.radius);
        joystick.nubX = joystick.baseX + Math.cos(joystick.angle) * cappedDist;
        joystick.nubY = joystick.baseY + Math.sin(joystick.angle) * cappedDist;
    }

    // Game Logic
    function initPlayer() {
        player = {
            x: width / 2,
            y: height / 2 - 50,
            size: 24,
            hp: 100,
            maxHp: 100,
            shield: 50,
            maxShield: 50,
            damage: 35,
            fireRate: 350, 
            lastShot: 0
        };
    }

    function generateObstacles() {
        obstacles = [];
        let numObstacles = 3 + Math.floor(Math.random() * 4);
        for(let i=0; i<numObstacles; i++) {
            let w = 40 + Math.random() * 80;
            let h = 40 + Math.random() * 80;
            let x = Math.random() * (width - w);
            let y = Math.random() * (height - h - 150); // Keep away from joystick area

            // Don't spawn on top of player
            if (x < player.x + 80 && x + w > player.x - 80 && 
                y < player.y + 80 && y + h > player.y - 80) {
                continue;
            }
            obstacles.push({x, y, w, h});
        }
    }

    function startGame() {
        initPlayer();
        wave = 1;
        resetWave();
        startMenu.classList.add('hidden');
        hud.classList.remove('hidden');
        gameState = 'PLAY';
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function resetGame() {
        gameOverMenu.classList.add('hidden');
        victoryMenu.classList.add('hidden');
        startMenu.classList.remove('hidden');
        hud.classList.add('hidden');
        gameState = 'START';
    }

    function resetWave() {
        bullets = [];
        enemies = [];
        enemyBullets = [];
        particles = [];
        enemiesToSpawn = 5 + (wave * 3);
        spawnInterval = Math.max(400, 1200 - (wave * 60));
        
        player.shield = player.maxShield; // Full shield recharge
        generateObstacles();
        updateHUD();
    }

    function applyUpgrade(type) {
        if (type === 'damage') player.damage += 20;
        else if (type === 'firerate') player.fireRate = Math.max(100, player.fireRate * 0.75);
        else if (type === 'shield') player.maxShield += 30;
        
        player.hp = Math.min(player.maxHp, player.hp + 25); // Minor HP heal
        
        wave++;
        upgradeMenu.classList.add('hidden');
        resetWave();
        gameState = 'PLAY';
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        waveDisplay.innerText = `WAVE: ${wave}/${maxWaves}`;
        shieldDisplay.innerText = `SHIELD: ${Math.floor(player.shield)}`;
        hpDisplay.innerText = `HP: ${Math.floor(player.hp)}`;
        enemyDisplay.innerText = `ENEMIES: ${enemies.length + enemiesToSpawn}`;
    }

    function damagePlayer(amount) {
        if (player.shield > 0) {
            player.shield -= amount;
            if (player.shield < 0) {
                player.hp += player.shield; // Apply overflow to HP
                player.shield = 0;
            }
        } else {
            player.hp -= amount;
        }
        createExplosion(player.x, player.y, player.shield > 0 ? '#00ffff' : '#ff00ff');
        updateHUD();

        if (player.hp <= 0) {
            gameState = 'GAMEOVER';
            gameOverMenu.classList.remove('hidden');
            hud.classList.add('hidden');
        }
    }

    function spawnEnemy() {
        let edge = Math.floor(Math.random() * 4);
        let ex, ey;
        let margin = 30;
        if (edge === 0) { ex = Math.random() * width; ey = -margin; } 
        else if (edge === 1) { ex = width + margin; ey = Math.random() * height; } 
        else if (edge === 2) { ex = Math.random() * width; ey = height + margin; } 
        else { ex = -margin; ey = Math.random() * height; } 

        let isAdvanced = Math.random() < (wave * 0.12);

        enemies.push({
            x: ex, y: ey,
            size: isAdvanced ? 20 : 16,
            hp: 40 + (wave * 12),
            speed: 1.2 + Math.random() * 0.6 + (wave * 0.08),
            color: isAdvanced ? '#ffff00' : '#ff00ff', // Neon Yellow or Magenta
            strafeDir: Math.random() > 0.5 ? 1 : -1,
            lastShot: 0,
            fireRate: isAdvanced ? 1200 : 2000,
            optimalRange: isAdvanced ? 200 : 120,
            type: isAdvanced ? 'sniper' : 'fighter'
        });
        enemiesToSpawn--;
        updateHUD();
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1.0,
                color: color,
                size: 2 + Math.random() * 4
            });
        }
    }

    function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
        return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
    }

    function checkObstacleCollision(entity) {
        let es = entity.size || 6;
        let ew = es, eh = es;
        let ex = entity.x - ew/2, ey = entity.y - eh/2;
        
        for (let obs of obstacles) {
            if (rectIntersect(ex, ey, ew, eh, obs.x, obs.y, obs.w, obs.h)) {
                return true;
            }
        }
        return false;
    }

    function update(dt) {
        let now = performance.now();

        if (enemies.length === 0 && enemiesToSpawn === 0) {
            if (wave >= maxWaves) {
                gameState = 'VICTORY';
                victoryMenu.classList.remove('hidden');
                hud.classList.add('hidden');
            } else {
                gameState = 'UPGRADE';
                upgradeMenu.classList.remove('hidden');
            }
            return;
        }

        spawnTimer += dt;
        if (spawnTimer > spawnInterval && enemiesToSpawn > 0) {
            spawnEnemy();
            spawnTimer = 0;
        }

        // Player Shooting
        if (joystick.active && now - player.lastShot > player.fireRate) {
            bullets.push({
                x: player.x, y: player.y,
                vx: Math.cos(joystick.angle) * 12,
                vy: Math.sin(joystick.angle) * 12,
                life: 1500,
                color: '#00ffff' // Neon Cyan
            });
            player.lastShot = now;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life -= dt;
            if (b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height || checkObstacleCollision(b)) {
                if(checkObstacleCollision(b)) createExplosion(b.x, b.y, '#ffffff');
                bullets.splice(i, 1);
            }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let b = enemyBullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life -= dt;

            if (Math.hypot(b.x - player.x, b.y - player.y) < player.size) {
                damagePlayer(15);
                enemyBullets.splice(i, 1);
                continue;
            }

            if (b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height || checkObstacleCollision(b)) {
                enemyBullets.splice(i, 1);
            }
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dx = player.x - e.x;
            let dy = player.y - e.y;
            let dist = Math.hypot(dx, dy);
            let angleToPlayer = Math.atan2(dy, dx);
            
            let oldX = e.x;
            let oldY = e.y;

            if (dist > e.optimalRange) {
                e.x += Math.cos(angleToPlayer) * e.speed;
                e.y += Math.sin(angleToPlayer) * e.speed;
            } else {
                let strafeAngle = angleToPlayer + (Math.PI / 2 * e.strafeDir);
                e.x += Math.cos(strafeAngle) * (e.speed * 0.8);
                e.y += Math.sin(strafeAngle) * (e.speed * 0.8);
                
                if (dist < e.optimalRange - 20) {
                   e.x -= Math.cos(angleToPlayer) * e.speed * 0.6;
                   e.y -= Math.sin(angleToPlayer) * e.speed * 0.6;
                }

                if (now - e.lastShot > e.fireRate) {
                    let shootAngle = angleToPlayer + (Math.random() - 0.5) * 0.15;
                    let projSpeed = e.type === 'sniper' ? 8 : 5;
                    enemyBullets.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(shootAngle) * projSpeed,
                        vy: Math.sin(shootAngle) * projSpeed,
                        life: 2500,
                        color: e.color
                    });
                    e.lastShot = now;
                }
            }

            // Obstacle sliding for enemies
            if (checkObstacleCollision(e)) {
                e.x = oldX; 
                if (checkObstacleCollision(e)) { 
                    e.x = e.x + (Math.cos(angleToPlayer)*e.speed); // Force push 
                    e.y = oldY; 
                }
            }

            // Damage from player
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.abs(b.x - e.x) < e.size && Math.abs(b.y - e.y) < e.size) {
                    e.hp -= player.damage;
                    createExplosion(e.x, e.y, b.color);
                    bullets.splice(j, 1);
                    if (e.hp <= 0) {
                        enemies.splice(i, 1);
                        createExplosion(e.x, e.y, e.color); 
                        updateHUD();
                        break;
                    }
                }
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt * 0.003;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#080a12';
        ctx.fillRect(0, 0, width, height);

        // Grid
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        let gridSize = 50;
        let offsetX = (Date.now() / 30) % gridSize; 
        for (let x = 0; x < width + gridSize; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x - offsetX, 0); ctx.lineTo(x - offsetX, height); ctx.stroke();
        }
        for (let y = 0; y < height + gridSize; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y - offsetX); ctx.lineTo(width, y - offsetX); ctx.stroke();
        }

        // Obstacles
        for (let obs of obstacles) {
            ctx.fillStyle = '#111522';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#ff00ff'; // Neon border
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff00ff';
            ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            ctx.shadowBlur = 0;
        }

        // Player
        if (player.hp > 0) {
            // Dotted Aiming Line
            if (joystick.active) {
                ctx.setLineDash([10, 15]);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + Math.cos(joystick.angle) * width, player.y + Math.sin(joystick.angle) * width);
                ctx.stroke();
                ctx.setLineDash([]); // Reset
            }

            // Shield Glow
            if (player.shield > 0) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.strokeRect(player.x - player.size, player.y - player.size, player.size*2, player.size*2);
            }

            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
            ctx.shadowBlur = 0;
        }

        // Enemies
        for (let e of enemies) {
            ctx.fillStyle = '#111522'; // Hollow center
            ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = e.color;
            ctx.strokeRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            ctx.shadowBlur = 0;
        }

        // Bullets
        for (let b of bullets) {
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = b.color;
            ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
            ctx.shadowBlur = 0;
        }

        // Enemy Bullets
        for (let b of enemyBullets) {
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = b.color;
            ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            ctx.shadowBlur = 0;
        }

        // Particles (Blocky)
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1.0; 

        // Virtual Joystick
        if (gameState === 'PLAY') {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(joystick.baseX, joystick.baseY, joystick.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = joystick.active ? 'rgba(0, 255, 255, 0.8)' : 'rgba(0, 255, 255, 0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff';
            ctx.beginPath();
            ctx.arc(joystick.nubX, joystick.nubY, joystick.radius * 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function gameLoop(timestamp) {
        if (gameState !== 'PLAY') return;
        let dt = timestamp - lastTime;
        lastTime = timestamp;

        update(dt);
        draw();

        if (gameState === 'PLAY') requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
