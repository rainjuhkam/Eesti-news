<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Marathon: Defense Protocol</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #080a12; overflow: hidden;
            font-family: 'Courier New', Courier, monospace; touch-action: none;
        }
        #game-container { position: relative; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .hud {
            position: absolute; top: 15px; left: 15px; text-align: left;
            font-size: 14px; font-weight: bold; background: rgba(8, 10, 18, 0.8);
            padding: 10px; border: 2px solid #00ffff; box-shadow: 0 0 10px #00ffff; pointer-events: none;
        }
        .hud span { display: block; margin-bottom: 5px; }
        
        .build-menu {
            position: absolute; right: 15px; bottom: 30px; display: flex; flex-direction: column; gap: 15px;
            pointer-events: auto; /* Allow clicks */
        }
        .build-btn {
            background: rgba(8, 10, 18, 0.9); color: #fff; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; font-size: 14px; padding: 15px; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; text-shadow: 0 0 5px #fff; transition: transform 0.1s;
        }
        .build-btn:active { transform: scale(0.95); }
        .btn-laser { border: 2px solid #00ffff; box-shadow: 0 0 10px #00ffff inset, 0 0 10px #00ffff; color: #00ffff;}
        .btn-bomber { border: 2px solid #ff9900; box-shadow: 0 0 10px #ff9900 inset, 0 0 10px #ff9900; color: #ff9900;}

        .menu {
            background: rgba(8, 10, 18, 0.95); border: 3px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff; padding: 25px; pointer-events: auto; max-width: 95%; color: #fff;
        }
        h1 { margin-top: 0; font-size: 26px; color: #ffff00; text-shadow: 0 0 10px #ffff00; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        
        .upgrade-btn {
            display: block; width: 100%; background: #080a12; color: #00ffff;
            border: 2px solid #00ffff; box-shadow: 0 0 10px #00ffff inset;
            padding: 15px 10px; margin-bottom: 10px; font-size: 14px; font-weight: bold;
            font-family: 'Courier New', Courier, monospace; cursor: pointer; text-transform: uppercase;
        }
        .upgrade-btn:active { background: #00ffff; color: #000; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud" class="hud hidden">
        <span id="wave-display" style="color: #ffff00;">WAVE: 1/10</span>
        <span id="hp-display" style="color: #ff00ff;">HP: 100</span>
        <span id="diamond-display" style="color: #00ffff; text-shadow: 0 0 8px #00ffff; font-size: 16px;">DIAMONDS: 0</span>
        <span id="enemy-display" style="color: #fff;">ENEMIES: 0</span>
    </div>

    <div id="build-menu" class="build-menu hidden">
        <button class="build-btn btn-laser" onmousedown="tryBuild('laser', event)" ontouchstart="tryBuild('laser', event)">BUILD LASER [10 💎]</button>
        <button class="build-btn btn-bomber" onmousedown="tryBuild('bomber', event)" ontouchstart="tryBuild('bomber', event)">BUILD BOMBER [25 💎]</button>
    </div>

    <div id="ui-layer">
        <div id="start-menu" class="menu">
            <h1>DEFENSE PROTOCOL</h1>
            <p>MOVE TO AIM. ENEMIES DROP DIAMONDS.<br>USE DIAMONDS TO DEPLOY TOWERS.</p>
            <button class="upgrade-btn" onclick="startGame()">INITIALIZE (ENABLE AUDIO)</button>
        </div>

        <div id="upgrade-menu" class="menu hidden">
            <h1>SECTOR CLEARED</h1>
            <p>CHOOSE CYBERNETIC ENHANCEMENT:</p>
            <button class="upgrade-btn" onclick="applyUpgrade('damage')">DAMAGE UP (+25 DMG)</button>
            <button class="upgrade-btn" onclick="applyUpgrade('firerate')">FIRE RATE UP (+15% SPD)</button>
            <button class="upgrade-btn" onclick="applyUpgrade('speed')">MOVEMENT SPD (+1.5)</button>
        </div>

        <div id="game-over-menu" class="menu hidden" style="border-color: #ff0000; box-shadow: 0 0 20px #ff0000;">
            <h1 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">SYSTEM FAILURE</h1>
            <button class="upgrade-btn" onclick="resetGame()" style="border-color: #ff0000; color: #ff0000;">REBOOT</button>
        </div>
    </div>
</div>

<script>
    // --- AUDIO SYNTHESIZER ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'pew') { // Player & Laser Tower
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'enemy_pew') { // Enemy shoot
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'boom') { // Bomber tower explode / Enemy hit base
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'die') { // Enemy killed
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'pickup') { // Diamond collect
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.linearRampToValueAtTime(1600, now + 0.05);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'build') { // Tower built
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'error') { // Cannot build
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let gameState = 'START'; 
    let wave = 1, maxWaves = 10, lastTime = 0;
    
    const ARENA_W = 2000, ARENA_H = 2000;
    const enemyPath = [{x: 200, y: -50}, {x: 200, y: 600}, {x: 1800, y: 600}, {x: 1800, y: 1400}, {x: 200, y: 1400}, {x: 200, y: 2050}];

    let player, bullets = [], enemyBullets = [], enemies = [], particles = [], floatingTexts = [];
    let diamonds = [], towers = [], bombs = [];
    let enemiesToSpawn = 0, spawnTimer = 0, spawnInterval = 1000;

    let joystick = { active: false, touchId: null, baseX: 0, baseY: 0, nubX: 0, nubY: 0, radius: 60, angle: 0 };

    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        joystick.baseX = width / 4; joystick.baseY = height - 120;
        joystick.nubX = joystick.baseX; joystick.nubY = joystick.baseY;
    }
    window.addEventListener('resize', resize); resize();

    function releaseJoystick() { joystick.active = false; joystick.touchId = null; joystick.nubX = joystick.baseX; joystick.nubY = joystick.baseY; }

    canvas.addEventListener('touchstart', e => handleTouch(e, 'start'), {passive: false});
    canvas.addEventListener('touchmove', e => handleTouch(e, 'move'), {passive: false});
    canvas.addEventListener('touchend', e => handleTouch(e, 'end'), {passive: false});
    canvas.addEventListener('touchcancel', e => handleTouch(e, 'end'), {passive: false});

    function handleTouch(e, type) {
        e.preventDefault();
        if (gameState !== 'PLAY') return; 
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            // Only start joystick on left half of screen to avoid overlapping build buttons
            if (type === 'start' && t.clientX < width * 0.7) {
                if (!joystick.active) { joystick.active = true; joystick.touchId = t.identifier; joystick.baseX = t.clientX; joystick.baseY = t.clientY; updateJoystick(t.clientX, t.clientY); }
            } else if (type === 'move' && t.identifier === joystick.touchId) {
                updateJoystick(t.clientX, t.clientY);
            } else if (type === 'end' && t.identifier === joystick.touchId) { releaseJoystick(); }
        }
    }

    function updateJoystick(x, y) {
        let dx = x - joystick.baseX, dy = y - joystick.baseY; joystick.angle = Math.atan2(dy, dx);
        let dist = Math.min(Math.hypot(dx, dy), joystick.radius);
        joystick.nubX = joystick.baseX + Math.cos(joystick.angle) * dist; joystick.nubY = joystick.baseY + Math.sin(joystick.angle) * dist;
    }

    function initPlayer() {
        player = {
            x: ARENA_W / 2, y: ARENA_H / 2, radius: 14, speed: 6,
            hp: 100, maxHp: 100, diamonds: 25, // Start with 25 so they can build right away
            damage: 40, fireRate: 350, lastShot: 0, aimAngle: 0
        };
    }

    function startGame() { 
        initAudio(); releaseJoystick(); initPlayer(); wave = 1; resetWave(); 
        towers = []; diamonds = []; bombs = []; // Clear field
        document.getElementById('start-menu').classList.add('hidden'); 
        document.getElementById('hud').classList.remove('hidden'); 
        document.getElementById('build-menu').classList.remove('hidden'); 
        gameState = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop); 
    }
    
    function resetGame() { 
        releaseJoystick(); 
        document.getElementById('game-over-menu').classList.add('hidden'); 
        document.getElementById('start-menu').classList.remove('hidden'); 
        document.getElementById('hud').classList.add('hidden'); 
        document.getElementById('build-menu').classList.add('hidden'); 
        gameState = 'START'; 
    }
    
    function resetWave() {
        bullets = []; enemies = []; enemyBullets = []; particles = []; floatingTexts = []; bombs = [];
        enemiesToSpawn = 8 + (wave * 4); spawnInterval = Math.max(400, 1500 - (wave * 100));
        updateHUD();
    }

    function applyUpgrade(type) {
        if (type === 'damage') player.damage += 25;
        else if (type === 'firerate') player.fireRate *= 0.85; 
        else if (type === 'speed') player.speed += 1.5; 
        player.hp = player.maxHp; 
        wave++; document.getElementById('upgrade-menu').classList.add('hidden'); 
        document.getElementById('build-menu').classList.remove('hidden');
        resetWave(); releaseJoystick(); gameState = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById('wave-display').innerText = `WAVE: ${wave}/${maxWaves}`;
        document.getElementById('hp-display').innerText = `HP: ${Math.floor(player.hp)}`;
        document.getElementById('diamond-display').innerText = `DIAMONDS: ${player.diamonds}`;
        document.getElementById('enemy-display').innerText = `ENEMIES: ${enemies.length + enemiesToSpawn}`;
    }

    function damagePlayer(amount) {
        player.hp -= amount;
        createExplosion(player.x, player.y, '#ff0000'); playSound('boom'); updateHUD();
        if (player.hp <= 0) { releaseJoystick(); gameState = 'GAMEOVER'; document.getElementById('game-over-menu').classList.remove('hidden'); document.getElementById('hud').classList.add('hidden'); document.getElementById('build-menu').classList.add('hidden');}
    }

    function spawnEnemy() {
        let isAdvanced = Math.random() < (wave * 0.15);
        // BUFFED ENEMIES
        let hp = 100 + (wave * 40);
        enemies.push({
            x: enemyPath[0].x, y: enemyPath[0].y, size: isAdvanced ? 26 : 20,
            hp: hp, maxHp: hp, speed: 1.0 + Math.random() * 0.4 + (wave * 0.05),
            color: isAdvanced ? '#ffff00' : '#ff00ff', 
            lastShot: 0, fireRate: isAdvanced ? 1200 : 2500, optimalRange: isAdvanced ? 400 : 250, 
            type: isAdvanced ? 'sniper' : 'fighter', pathIndex: 1
        });
        enemiesToSpawn--; updateHUD();
    }

    function killEnemy(index, e) {
        enemies.splice(index, 1);
        createExplosion(e.x, e.y, e.color);
        playSound('die');
        // Drop diamond
        diamonds.push({x: e.x + (Math.random()-0.5)*20, y: e.y + (Math.random()-0.5)*20, life: 15000}); // 15s life
        updateHUD();
    }

    // --- TOWER BUILDING ---
    function tryBuild(type, event) {
        if(event) event.stopPropagation(); // Don't trigger joystick
        initAudio();
        
        let cost = type === 'laser' ? 10 : 25;
        if (player.diamonds < cost) {
            playSound('error'); addDamageText(player.x, player.y, "NOT ENOUGH DIAMONDS", '#ff0000'); return;
        }

        // Exclusion Zone Check (Towers can't be closer than 80px to each other)
        for (let t of towers) {
            if (Math.hypot(t.x - player.x, t.y - player.y) < 80) {
                playSound('error'); addDamageText(player.x, player.y, "TOO CLOSE TO TOWER", '#ff0000'); return;
            }
        }

        // Build it!
        player.diamonds -= cost; updateHUD(); playSound('build');
        towers.push({
            x: player.x, y: player.y, type: type,
            range: type === 'laser' ? 350 : 500,
            fireRate: type === 'laser' ? 400 : 2500,
            damage: type === 'laser' ? 25 : 120, // Bomber does high splash
            lastShot: performance.now()
        });
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1.0, color: color, size: 2 + Math.random() * 4 });
    }
    function addDamageText(x, y, text, color='#ffffff') { floatingTexts.push({ x: x, y: y, text: text, life: 1.0, color: color }); }

    function update(dt) {
        let now = performance.now();

        if (enemies.length === 0 && enemiesToSpawn === 0) {
            releaseJoystick(); 
            document.getElementById('build-menu').classList.add('hidden');
            gameState = 'UPGRADE'; document.getElementById('upgrade-menu').classList.remove('hidden');
            return;
        }

        spawnTimer += dt;
        if (spawnTimer > spawnInterval && enemiesToSpawn > 0) { spawnEnemy(); spawnTimer = 0; }

        // Player Movement
        if (joystick.active) {
            player.x += Math.cos(joystick.angle) * player.speed;
            player.y += Math.sin(joystick.angle) * player.speed;
            player.x = Math.max(player.radius, Math.min(ARENA_W - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(ARENA_H - player.radius, player.y));
        }

        // Diamond Pickup
        for (let i = diamonds.length - 1; i >= 0; i--) {
            let d = diamonds[i]; d.life -= dt;
            let dist = Math.hypot(player.x - d.x, player.y - d.y);
            if (dist < player.radius + 30) { // Magnet radius
                d.x += (player.x - d.x) * 0.15; d.y += (player.y - d.y) * 0.15;
            }
            if (dist < player.radius + 10) { // Pickup
                player.diamonds++; playSound('pickup'); updateHUD(); diamonds.splice(i, 1);
            } else if (d.life <= 0) { diamonds.splice(i, 1); } // Despawn
        }

        // Player Auto Fire
        let nearestEnemy = null, minDist = 600;
        for (let e of enemies) {
            let d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < minDist) { minDist = d; nearestEnemy = e; }
        }
        if (nearestEnemy) {
            player.aimAngle = Math.atan2(nearestEnemy.y - player.y, nearestEnemy.x - player.x);
            if (now - player.lastShot > player.fireRate) {
                bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.aimAngle) * 16, vy: Math.sin(player.aimAngle) * 16, life: 1000, color: '#00ffff', damage: player.damage });
                playSound('pew'); player.lastShot = now;
            }
        } else if (joystick.active) player.aimAngle = joystick.angle;

        // Tower Logic
        for (let t of towers) {
            let tTarget = null, tMinDist = t.range;
            for (let e of enemies) {
                let d = Math.hypot(e.x - t.x, e.y - t.y);
                if (d < tMinDist) { tMinDist = d; tTarget = e; }
            }
            if (tTarget && now - t.lastShot > t.fireRate) {
                let angle = Math.atan2(tTarget.y - t.y, tTarget.x - t.x);
                if (t.type === 'laser') {
                    bullets.push({ x: t.x, y: t.y, vx: Math.cos(angle)*16, vy: Math.sin(angle)*16, life: 1000, color: '#00ffff', damage: t.damage });
                    playSound('pew');
                } else if (t.type === 'bomber') {
                    bombs.push({ x: t.x, y: t.y, targetX: tTarget.x, targetY: tTarget.y, speed: 7, damage: t.damage, radius: 120 });
                    playSound('pew'); // Launch sound
                }
                t.lastShot = now;
            }
        }

        // Update Bombs (AOE Projectiles)
        for (let i = bombs.length - 1; i >= 0; i--) {
            let b = bombs[i];
            let dx = b.targetX - b.x, dy = b.targetY - b.y;
            let dist = Math.hypot(dx, dy);
            if (dist < b.speed) {
                // Explode!
                createExplosion(b.targetX, b.targetY, '#ff9900'); playSound('boom');
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(e.x - b.targetX, e.y - b.targetY) < b.radius) {
                        e.hp -= b.damage; addDamageText(e.x, e.y - 15, b.damage, '#ff9900');
                        if (e.hp <= 0) killEnemy(j, e);
                    }
                }
                bombs.splice(i, 1);
            } else {
                b.x += (dx / dist) * b.speed; b.y += (dy / dist) * b.speed;
            }
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life -= dt;
            if (b.life <= 0 || b.x < 0 || b.x > ARENA_W || b.y < 0 || b.y > ARENA_H) bullets.splice(i, 1);
        }

        // Enemy Bullets
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let b = enemyBullets[i]; b.x += b.vx; b.y += b.vy; b.life -= dt;
            if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius) { damagePlayer(10); enemyBullets.splice(i, 1); continue; }
            if (b.life <= 0 || b.x < 0 || b.x > ARENA_W || b.y < 0 || b.y > ARENA_H) enemyBullets.splice(i, 1);
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let targetWP = enemyPath[e.pathIndex];
            let dx = targetWP.x - e.x, dy = targetWP.y - e.y;
            let distToWP = Math.hypot(dx, dy);

            // Movement
            if (distToWP < e.speed) {
                e.pathIndex++;
                if (e.pathIndex >= enemyPath.length) {
                    damagePlayer(25); createExplosion(e.x, e.y, '#ff0000'); enemies.splice(i, 1); updateHUD(); continue;
                }
            } else {
                let moveAngle = Math.atan2(dy, dx);
                e.x += Math.cos(moveAngle) * e.speed; e.y += Math.sin(moveAngle) * e.speed;
            }

            // Shoot Player
            let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
            if (distToPlayer <= e.optimalRange && now - e.lastShot > e.fireRate) {
                let shootAngle = Math.atan2(player.y - e.y, player.x - e.x) + (Math.random() - 0.5) * 0.1;
                enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(shootAngle) * 6, vy: Math.sin(shootAngle) * 6, life: 2500, color: e.color });
                playSound('enemy_pew'); e.lastShot = now;
            }

            // Hit by bullets
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.abs(b.x - e.x) < e.size/2 + 4 && Math.abs(b.y - e.y) < e.size/2 + 4) {
                    e.hp -= b.damage; addDamageText(e.x, e.y - 20, Math.floor(b.damage));
                    createExplosion(e.x, e.y, b.color); bullets.splice(j, 1);
                    if (e.hp <= 0) { killEnemy(i, e); break; }
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= dt * 0.003; if (p.life <= 0) particles.splice(i, 1); }
        for (let i = floatingTexts.length - 1; i >= 0; i--) { let ft = floatingTexts[i]; ft.y -= dt * 0.05; ft.life -= dt * 0.0015; if (ft.life <= 0) floatingTexts.splice(i, 1); }
    }

    function draw() {
        ctx.fillStyle = '#080a12'; ctx.fillRect(0, 0, width, height);

        ctx.save();
        let camX = width/2 - player.x; let camY = height/2 - player.y;
        ctx.translate(camX, camY);

        ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, ARENA_W, ARENA_H);

        // Grid
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)'; ctx.lineWidth = 1; let gridSize = 50;
        ctx.beginPath();
        for (let x = 0; x <= ARENA_W; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, ARENA_H); }
        for (let y = 0; y <= ARENA_H; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(ARENA_W, y); }
        ctx.stroke();

        // TD Path
        ctx.beginPath(); ctx.moveTo(enemyPath[0].x, enemyPath[0].y);
        for(let i=1; i<enemyPath.length; i++) ctx.lineTo(enemyPath[i].x, enemyPath[i].y);
        ctx.strokeStyle = 'rgba(255, 255, 0, 0.15)'; ctx.lineWidth = 40; ctx.lineJoin = 'round'; ctx.stroke(); 
        ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)'; ctx.lineWidth = 4; ctx.stroke();

        // Diamonds
        for (let d of diamonds) {
            ctx.fillStyle = '#00ffff'; ctx.beginPath();
            ctx.moveTo(d.x, d.y - 8); ctx.lineTo(d.x + 6, d.y); ctx.lineTo(d.x, d.y + 8); ctx.lineTo(d.x - 6, d.y); ctx.fill();
            ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.fill(); ctx.shadowBlur = 0;
        }

        // Towers
        for (let t of towers) {
            // Draw Exclusion Range subtle pulse
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.arc(t.x, t.y, 80, 0, Math.PI*2); ctx.stroke();

            if (t.type === 'laser') {
                ctx.fillStyle = '#111522'; ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#00ffff'; ctx.fillRect(t.x - 4, t.y - 4, 8, 8);
            } else {
                ctx.fillStyle = '#111522'; ctx.fillRect(t.x - 14, t.y - 14, 28, 28);
                ctx.strokeStyle = '#ff9900'; ctx.lineWidth = 3; ctx.strokeRect(t.x - 14, t.y - 14, 28, 28);
                ctx.fillStyle = '#ff9900'; ctx.beginPath(); ctx.arc(t.x, t.y, 6, 0, Math.PI*2); ctx.fill();
            }
        }

        // Player
        if (player.hp > 0) {
            ctx.setLineDash([8, 12]); ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + Math.cos(player.aimAngle) * 800, player.y + Math.sin(player.aimAngle) * 800); ctx.stroke(); ctx.setLineDash([]);

            ctx.fillStyle = '#080a12'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowBlur = 8; ctx.shadowColor = '#00ffff'; ctx.stroke(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 0.4, 0, Math.PI*2); ctx.fill();
            
            // Build radius indicator
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctx.beginPath(); ctx.arc(player.x, player.y, 80, 0, Math.PI*2); ctx.stroke();
        }

        // Enemies
        for (let e of enemies) {
            ctx.fillStyle = '#111522'; ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            ctx.strokeStyle = e.color; ctx.lineWidth = 3; ctx.shadowBlur = 8; ctx.shadowColor = e.color; ctx.strokeRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size); ctx.shadowBlur = 0;

            let hpRatio = e.hp / e.maxHp; let barW = e.size * 1.5;
            ctx.fillStyle = 'rgba(255, 0, 0, 0.7)'; ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 10, barW, 4);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.9)'; ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 10, barW * hpRatio, 4);
        }

        // Bombs (AOE)
        for (let b of bombs) {
            ctx.fillStyle = '#ff9900'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 15; ctx.shadowColor = '#ff9900'; ctx.fill(); ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 153, 0, 0.3)'; ctx.beginPath(); ctx.arc(b.targetX, b.targetY, b.radius, 0, Math.PI*2); ctx.stroke(); // Show impact zone
        }

        for (let b of bullets) { ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.fillRect(b.x - 3, b.y - 3, 6, 6); ctx.shadowBlur = 0; }
        for (let b of enemyBullets) { ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.fillRect(b.x - 2, b.y - 2, 4, 4); ctx.shadowBlur = 0; }
        for (let p of particles) { ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fillRect(p.x, p.y, p.size, p.size); }
        
        ctx.globalAlpha = 1.0; 
        for (let ft of floatingTexts) {
            ctx.globalAlpha = Math.max(0, ft.life); ctx.fillStyle = ft.color; ctx.font = "bold 14px 'Courier New'";
            ctx.shadowBlur = 4; ctx.shadowColor = '#000'; ctx.fillText(ft.text, ft.x - 10, ft.y); ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1.0;

        ctx.restore();

        // UI Layer
        if (gameState === 'PLAY') {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, joystick.radius, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = joystick.active ? 'rgba(0, 255, 255, 0.8)' : 'rgba(0, 255, 255, 0.4)'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.beginPath(); ctx.arc(joystick.nubX, joystick.nubY, joystick.radius * 0.35, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            
            let distToStart = Math.hypot(enemyPath[0].x - player.x, enemyPath[0].y - player.y);
            if (distToStart > Math.min(width, height) / 2 - 50) {
                let angleToStart = Math.atan2(enemyPath[0].y - player.y, enemyPath[0].x - player.x);
                let indRadius = Math.min(width, height) / 2 - 40;
                let indX = width / 2 + Math.cos(angleToStart) * indRadius; let indY = height / 2 + Math.sin(angleToStart) * indRadius;

                ctx.save(); ctx.translate(indX, indY); ctx.rotate(angleToStart);
                ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, -10); ctx.lineTo(-10, 10); ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 0, 0.8)'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffff00'; ctx.fill(); ctx.shadowBlur = 0;
                ctx.rotate(-angleToStart); ctx.fillStyle = '#ffff00'; ctx.font = "bold 12px 'Courier New'"; ctx.textAlign = 'center'; ctx.fillText("SPAWN", 0, 25);
                ctx.restore();
            }
        }
    }

    function gameLoop(timestamp) {
        if (gameState !== 'PLAY') return;
        let dt = timestamp - lastTime; lastTime = timestamp; update(dt); draw(); requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
