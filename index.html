<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Marathon: Circle vs Square</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #080a12; overflow: hidden;
            font-family: 'Courier New', Courier, monospace; touch-action: none;
        }
        #game-container { position: relative; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            color: #00ffff; text-shadow: 0 0 10px #00ffff;
        }
        .hud {
            position: absolute; top: 15px; left: 15px; text-align: left;
            font-size: 14px; font-weight: bold; background: rgba(8, 10, 18, 0.8);
            padding: 10px; border: 2px solid #00ffff; box-shadow: 0 0 10px #00ffff;
        }
        .hud span { display: block; margin-bottom: 5px; }
        .menu {
            background: rgba(8, 10, 18, 0.95); border: 3px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff; padding: 25px; pointer-events: auto; max-width: 95%;
        }
        h1 { margin-top: 0; font-size: 26px; color: #ffff00; text-shadow: 0 0 10px #ffff00; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.5; color: #fff; text-shadow: none; margin-bottom: 20px; }
        
        .upgrade-btn {
            display: block; width: 100%; background: #080a12; color: #00ffff;
            border: 2px solid #00ffff; box-shadow: 0 0 10px #00ffff inset;
            padding: 15px 10px; margin-bottom: 10px; font-size: 14px; font-weight: bold;
            font-family: 'Courier New', Courier, monospace; cursor: pointer; text-transform: uppercase;
        }
        .upgrade-btn:active { background: #00ffff; color: #000; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud" class="hud hidden">
        <span id="wave-display" style="color: #ffff00; text-shadow: 0 0 5px #ffff00;">WAVE: 1/10</span>
        <span id="shield-display" style="color: #00ffff; text-shadow: 0 0 5px #00ffff;">SHIELD: 50</span>
        <span id="hp-display" style="color: #ff00ff; text-shadow: 0 0 5px #ff00ff;">HP: 100</span>
        <span id="crit-display" style="color: #ff9900; text-shadow: 0 0 5px #ff9900;">CRIT: 5%</span>
        <span id="enemy-display" style="color: #fff; text-shadow: 0 0 5px #fff;">ENEMIES: 0</span>
    </div>

    <div id="ui-layer">
        <div id="start-menu" class="menu">
            <h1>RUNNER PROTOCOL</h1>
            <p>CIRCLE VS SQUARE.<br>OBSTACLES SHATTER AFTER 10 HITS.</p>
            <button class="upgrade-btn" onclick="startGame()">INITIALIZE</button>
        </div>

        <div id="upgrade-menu" class="menu hidden">
            <h1>SECTOR CLEARED</h1>
            <p>CHOOSE CYBERNETIC ENHANCEMENT:</p>
            <button class="upgrade-btn" onclick="applyUpgrade('damage')">DAMAGE UP (+20 DMG)</button>
            <button class="upgrade-btn" onclick="applyUpgrade('firerate')">FIRE RATE UP (+15% SPD)</button>
            <button class="upgrade-btn" onclick="applyUpgrade('shield')">SHIELD UP (+30 MAX)</button>
            <button class="upgrade-btn" style="color: #ff9900; border-color: #ff9900; box-shadow: 0 0 10px #ff9900 inset;" onclick="applyUpgrade('crit')">CRIT CHANCE (+10%)</button>
        </div>

        <div id="game-over-menu" class="menu hidden" style="border-color: #ff0000; box-shadow: 0 0 20px #ff0000;">
            <h1 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">SYSTEM FAILURE</h1>
            <button class="upgrade-btn" onclick="resetGame()" style="border-color: #ff0000; color: #ff0000; box-shadow: 0 0 10px #ff0000 inset;">REBOOT</button>
        </div>

        <div id="victory-menu" class="menu hidden" style="border-color: #00ff00; box-shadow: 0 0 20px #00ff00;">
            <h1 style="color: #00ff00; text-shadow: 0 0 10px #00ff00;">EXTRACTION COMPLETE</h1>
            <button class="upgrade-btn" onclick="resetGame()" style="border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px #00ff00 inset;">RETURN TO LOBBY</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startMenu = document.getElementById('start-menu');
    const upgradeMenu = document.getElementById('upgrade-menu');
    const gameOverMenu = document.getElementById('game-over-menu');
    const victoryMenu = document.getElementById('victory-menu');
    const hud = document.getElementById('hud');
    
    let width, height;
    let gameState = 'START'; 
    let wave = 1, maxWaves = 10, lastTime = 0;
    
    let player;
    let bullets = [], enemies = [], enemyBullets = [], particles = [], obstacles = [], floatingTexts = [];
    let enemiesToSpawn = 0, spawnTimer = 0, spawnInterval = 1000;

    let joystick = { active: false, touchId: null, baseX: 0, baseY: 0, nubX: 0, nubY: 0, radius: 60, angle: 0 };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        joystick.baseX = width / 2;
        joystick.baseY = height - 120;
        joystick.nubX = joystick.baseX; joystick.nubY = joystick.baseY;
        if (player) { player.x = width / 2; player.y = height / 2 - 50; }
    }
    window.addEventListener('resize', resize);
    resize();

    // Touch Controls
    canvas.addEventListener('touchstart', e => handleTouch(e, 'start'), {passive: false});
    canvas.addEventListener('touchmove', e => handleTouch(e, 'move'), {passive: false});
    canvas.addEventListener('touchend', e => handleTouch(e, 'end'), {passive: false});
    canvas.addEventListener('touchcancel', e => handleTouch(e, 'end'), {passive: false});

    function handleTouch(e, type) {
        e.preventDefault();
        if (gameState !== 'PLAY') return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            if (type === 'start') {
                if (Math.hypot(t.clientX - joystick.baseX, t.clientY - joystick.baseY) < joystick.radius * 2.5 && !joystick.active) {
                    joystick.active = true; joystick.touchId = t.identifier; updateJoystick(t.clientX, t.clientY);
                }
            } else if (type === 'move' && t.identifier === joystick.touchId) {
                updateJoystick(t.clientX, t.clientY);
            } else if (type === 'end' && t.identifier === joystick.touchId) {
                joystick.active = false; joystick.touchId = null;
                joystick.nubX = joystick.baseX; joystick.nubY = joystick.baseY;
            }
        }
    }

    function updateJoystick(x, y) {
        let dx = x - joystick.baseX, dy = y - joystick.baseY;
        joystick.angle = Math.atan2(dy, dx);
        let dist = Math.min(Math.hypot(dx, dy), joystick.radius);
        joystick.nubX = joystick.baseX + Math.cos(joystick.angle) * dist;
        joystick.nubY = joystick.baseY + Math.sin(joystick.angle) * dist;
    }

    function initPlayer() {
        player = {
            x: width / 2, y: height / 2 - 50, radius: 14,
            hp: 100, maxHp: 100, shield: 50, maxShield: 50,
            damage: 35, fireRate: 350, critChance: 0.05, critMult: 2.0, lastShot: 0
        };
    }

    function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
        return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
    }

    function generateObstacles() {
        obstacles = [];
        let numClusters = 3 + Math.floor(Math.random() * 3);
        let blockSize = 24;

        for (let c = 0; c < numClusters; c++) {
            let startX = 50 + Math.random() * (width - 150);
            let startY = 50 + Math.random() * (height - 250);
            let rows = 2 + Math.floor(Math.random() * 3);
            let cols = 2 + Math.floor(Math.random() * 3);

            // Keep away from player spawn area
            if (startX > player.x - 100 && startX < player.x + 100 && startY > player.y - 100 && startY < player.y + 100) continue;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    obstacles.push({
                        x: startX + c * blockSize, y: startY + r * blockSize,
                        w: blockSize, h: blockSize, hits: 10
                    });
                }
            }
        }
    }

    function startGame() { initPlayer(); wave = 1; resetWave(); startMenu.classList.add('hidden'); hud.classList.remove('hidden'); gameState = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop); }
    function resetGame() { gameOverMenu.classList.add('hidden'); victoryMenu.classList.add('hidden'); startMenu.classList.remove('hidden'); hud.classList.add('hidden'); gameState = 'START'; }
    
    function resetWave() {
        bullets = []; enemies = []; enemyBullets = []; particles = []; floatingTexts = [];
        enemiesToSpawn = 5 + (wave * 3); spawnInterval = Math.max(400, 1200 - (wave * 60));
        player.shield = player.maxShield; generateObstacles(); updateHUD();
    }

    function applyUpgrade(type) {
        if (type === 'damage') player.damage += 20;
        else if (type === 'firerate') player.fireRate *= 0.85; // 15% faster
        else if (type === 'shield') player.maxShield += 30;
        else if (type === 'crit') player.critChance += 0.10; // +10%
        
        player.hp = Math.min(player.maxHp, player.hp + 30); 
        wave++; upgradeMenu.classList.add('hidden'); resetWave(); gameState = 'PLAY'; lastTime = performance.now(); requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById('wave-display').innerText = `WAVE: ${wave}/${maxWaves}`;
        document.getElementById('shield-display').innerText = `SHIELD: ${Math.floor(player.shield)}`;
        document.getElementById('hp-display').innerText = `HP: ${Math.floor(player.hp)}`;
        document.getElementById('crit-display').innerText = `CRIT: ${Math.round(player.critChance * 100)}%`;
        document.getElementById('enemy-display').innerText = `ENEMIES: ${enemies.length + enemiesToSpawn}`;
    }

    function damagePlayer(amount) {
        if (player.shield > 0) {
            player.shield -= amount;
            if (player.shield < 0) { player.hp += player.shield; player.shield = 0; }
        } else { player.hp -= amount; }
        createExplosion(player.x, player.y, player.shield > 0 ? '#00ffff' : '#ff00ff');
        updateHUD();
        if (player.hp <= 0) { gameState = 'GAMEOVER'; gameOverMenu.classList.remove('hidden'); hud.classList.add('hidden'); }
    }

    function spawnEnemy() {
        let edge = Math.floor(Math.random() * 4);
        let ex, ey, margin = 30;
        if (edge === 0) { ex = Math.random() * width; ey = -margin; } 
        else if (edge === 1) { ex = width + margin; ey = Math.random() * height; } 
        else if (edge === 2) { ex = Math.random() * width; ey = height + margin; } 
        else { ex = -margin; ey = Math.random() * height; } 

        let isAdvanced = Math.random() < (wave * 0.12);
        let hp = 40 + (wave * 12);
        enemies.push({
            x: ex, y: ey, size: isAdvanced ? 22 : 18,
            hp: hp, maxHp: hp, speed: 1.2 + Math.random() * 0.6 + (wave * 0.08),
            color: isAdvanced ? '#ffff00' : '#ff00ff', strafeDir: Math.random() > 0.5 ? 1 : -1,
            lastShot: 0, fireRate: isAdvanced ? 1200 : 2000, optimalRange: isAdvanced ? 200 : 120, type: isAdvanced ? 'sniper' : 'fighter'
        });
        enemiesToSpawn--; updateHUD();
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1.0, color: color, size: 2 + Math.random() * 4 });
    }

    function addDamageText(x, y, dmg, isCrit) {
        floatingTexts.push({ x: x, y: y, text: dmg, life: 1.0, isCrit: isCrit });
    }

    function checkObstacleCollision(x, y, w, h) {
        for (let obs of obstacles) if (rectIntersect(x, y, w, h, obs.x, obs.y, obs.w, obs.h)) return true;
        return false;
    }

    function update(dt) {
        let now = performance.now();

        if (enemies.length === 0 && enemiesToSpawn === 0) {
            if (wave >= maxWaves) { gameState = 'VICTORY'; victoryMenu.classList.remove('hidden'); hud.classList.add('hidden'); } 
            else { gameState = 'UPGRADE'; upgradeMenu.classList.remove('hidden'); }
            return;
        }

        spawnTimer += dt;
        if (spawnTimer > spawnInterval && enemiesToSpawn > 0) { spawnEnemy(); spawnTimer = 0; }

        // Player Shooting
        if (joystick.active && now - player.lastShot > player.fireRate) {
            let isCrit = Math.random() < player.critChance;
            bullets.push({
                x: player.x, y: player.y, vx: Math.cos(joystick.angle) * 12, vy: Math.sin(joystick.angle) * 12,
                life: 1500, color: isCrit ? '#ff9900' : '#00ffff', isCrit: isCrit
            });
            player.lastShot = now;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy; b.life -= dt;
            
            let hitObsIndex = -1;
            for (let j = 0; j < obstacles.length; j++) {
                if (rectIntersect(b.x - 3, b.y - 3, 6, 6, obstacles[j].x, obstacles[j].y, obstacles[j].w, obstacles[j].h)) {
                    hitObsIndex = j; break;
                }
            }

            if (hitObsIndex !== -1) {
                let obs = obstacles[hitObsIndex];
                obs.hits -= 1;
                createExplosion(b.x, b.y, '#ffffff');
                if (obs.hits <= 0) {
                    createExplosion(obs.x + obs.w/2, obs.y + obs.h/2, '#ff00ff');
                    obstacles.splice(hitObsIndex, 1);
                }
                bullets.splice(i, 1);
                continue;
            }

            if (b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height) { bullets.splice(i, 1); }
        }

        // Enemy Bullets
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let b = enemyBullets[i];
            b.x += b.vx; b.y += b.vy; b.life -= dt;

            // Directional Shield
            if (joystick.active) {
                let angleToBullet = Math.atan2(b.y - player.y, b.x - player.x);
                let angleDiff = Math.abs(angleToBullet - joystick.angle);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + 20 && angleDiff <= Math.PI / 3) {
                    createExplosion(b.x, b.y, b.color); enemyBullets.splice(i, 1); continue;
                }
            }

            if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius) { damagePlayer(5); enemyBullets.splice(i, 1); continue; }
            if (b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height || checkObstacleCollision(b.x-2, b.y-2, 4, 4)) { enemyBullets.splice(i, 1); }
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dx = player.x - e.x, dy = player.y - e.y;
            let dist = Math.hypot(dx, dy), angleToPlayer = Math.atan2(dy, dx);
            let moveAngle = angleToPlayer;

            if (dist <= e.optimalRange) {
                moveAngle = angleToPlayer + (Math.PI / 2 * e.strafeDir);
                if (dist < e.optimalRange - 20) moveAngle = angleToPlayer + Math.PI + (Math.random() - 0.5); 
                if (now - e.lastShot > e.fireRate) {
                    let shootAngle = angleToPlayer + (Math.random() - 0.5) * 0.15;
                    let projSpeed = e.type === 'sniper' ? 8 : 5;
                    enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(shootAngle) * projSpeed, vy: Math.sin(shootAngle) * projSpeed, life: 2500, color: e.color });
                    e.lastShot = now;
                }
            }

            // Slide logic
            let vx = Math.cos(moveAngle) * e.speed, vy = Math.sin(moveAngle) * e.speed;
            e.x += vx; if (checkObstacleCollision(e.x - e.size/2, e.y - e.size/2, e.size, e.size)) e.x -= vx;
            e.y += vy; if (checkObstacleCollision(e.x - e.size/2, e.y - e.size/2, e.size, e.size)) e.y -= vy;

            // Damage from player
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.abs(b.x - e.x) < e.size/2 + 3 && Math.abs(b.y - e.y) < e.size/2 + 3) {
                    let dmg = b.isCrit ? player.damage * player.critMult : player.damage;
                    e.hp -= dmg;
                    addDamageText(e.x, e.y - 20, Math.floor(dmg), b.isCrit);
                    createExplosion(e.x, e.y, b.color);
                    bullets.splice(j, 1);
                    if (e.hp <= 0) {
                        enemies.splice(i, 1); createExplosion(e.x, e.y, e.color); updateHUD(); break;
                    }
                }
            }
        }

        // Particles & Text
        for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= dt * 0.003; if (p.life <= 0) particles.splice(i, 1); }
        for (let i = floatingTexts.length - 1; i >= 0; i--) { let ft = floatingTexts[i]; ft.y -= dt * 0.04; ft.life -= dt * 0.0015; if (ft.life <= 0) floatingTexts.splice(i, 1); }
    }

    function draw() {
        ctx.fillStyle = '#080a12'; ctx.fillRect(0, 0, width, height);

        // Grid
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)'; ctx.lineWidth = 1; let gridSize = 50, offsetX = (Date.now() / 30) % gridSize; 
        for (let x = 0; x < width + gridSize; x += gridSize) { ctx.beginPath(); ctx.moveTo(x - offsetX, 0); ctx.lineTo(x - offsetX, height); ctx.stroke(); }
        for (let y = 0; y < height + gridSize; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y - offsetX); ctx.lineTo(width, y - offsetX); ctx.stroke(); }

        // Destructible Obstacles
        for (let obs of obstacles) {
            let damageRatio = obs.hits / 10;
            ctx.fillStyle = `rgba(17, 21, 34, ${0.5 + damageRatio/2})`;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = `rgba(255, 0, 255, ${damageRatio})`;
            ctx.lineWidth = 1.5; ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            
            // Cracks representation based on hp
            if (obs.hits < 7) {
                ctx.beginPath(); ctx.moveTo(obs.x, obs.y); ctx.lineTo(obs.x + obs.w/2, obs.y + obs.h/2); ctx.strokeStyle = '#000'; ctx.stroke();
            }
        }

        // Player (Circle Robot)
        if (player.hp > 0) {
            if (joystick.active) {
                ctx.setLineDash([8, 12]); ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + Math.cos(joystick.angle) * width, player.y + Math.sin(joystick.angle) * width); ctx.stroke(); ctx.setLineDash([]);

                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 14, joystick.angle - Math.PI/3, joystick.angle + Math.PI/3);
                ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.stroke(); ctx.shadowBlur = 0;
            }

            if (player.shield > 0) {
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI*2);
                ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.stroke(); ctx.shadowBlur = 0;
            }

            ctx.fillStyle = '#080a12'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowBlur = 8; ctx.shadowColor = '#00ffff'; ctx.stroke(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 0.4, 0, Math.PI*2); ctx.fill();
        }

        // Square Enemies
        for (let e of enemies) {
            ctx.fillStyle = '#111522'; ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            ctx.strokeStyle = e.color; ctx.lineWidth = 3; ctx.shadowBlur = 8; ctx.shadowColor = e.color; ctx.strokeRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size); ctx.shadowBlur = 0;
            
            // Robot Eye
            ctx.fillStyle = e.color; ctx.fillRect(e.x - 3, e.y - 3, 6, 6);

            // Health Bar
            let hpRatio = e.hp / e.maxHp;
            let barW = e.size * 1.5;
            ctx.fillStyle = 'rgba(255, 0, 0, 0.7)'; ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 10, barW, 4);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.9)'; ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 10, barW * hpRatio, 4);
        }

        // Bullets
        for (let b of bullets) { ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.fillRect(b.x - 3, b.y - 3, 6, 6); ctx.shadowBlur = 0; }
        for (let b of enemyBullets) { ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.fillRect(b.x - 2, b.y - 2, 4, 4); ctx.shadowBlur = 0; }

        for (let p of particles) { ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fillRect(p.x, p.y, p.size, p.size); }
        ctx.globalAlpha = 1.0; 

        // Damage Numbers
        for (let ft of floatingTexts) {
            ctx.globalAlpha = Math.max(0, ft.life);
            ctx.fillStyle = ft.isCrit ? '#ff9900' : '#ffffff';
            ctx.font = ft.isCrit ? "bold 20px 'Courier New'" : "bold 14px 'Courier New'";
            ctx.shadowBlur = 4; ctx.shadowColor = '#000';
            ctx.fillText(ft.isCrit ? `CRIT! ${ft.text}` : ft.text, ft.x - 10, ft.y);
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1.0;

        if (gameState === 'PLAY') {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, joystick.radius, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = joystick.active ? 'rgba(0, 255, 255, 0.8)' : 'rgba(0, 255, 255, 0.4)'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.beginPath(); ctx.arc(joystick.nubX, joystick.nubY, joystick.radius * 0.35, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        }
    }

    function gameLoop(timestamp) {
        if (gameState !== 'PLAY') return;
        let dt = timestamp - lastTime; lastTime = timestamp;
        update(dt); draw();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
